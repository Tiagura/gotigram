name: Build and Push to Docker Hub

on:
  push:
    tags:
      - "v*.*.*"
      - "*.*.*"

env:
  REGISTRY_IMAGE: tiagura/gotigram

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        env:
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          VERSION="${REF_NAME#v}"

          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$REF_NAME' is not a valid release version."
            echo "Expected format: X.Y.Z or vX.Y.Z"
            exit 1
          fi

          CREATED=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          IMAGE="${REGISTRY_IMAGE}:${VERSION}"
          LATEST="${REGISTRY_IMAGE}:latest"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "latest=${LATEST}" >> "$GITHUB_OUTPUT"
          echo "created=${CREATED}" >> "$GITHUB_OUTPUT"
          echo "revision=${SHA}" >> "$GITHUB_OUTPUT"

          echo "### Image" >> "$GITHUB_STEP_SUMMARY"
          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | ${VERSION} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | ${IMAGE} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Latest | ${LATEST} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Revision | ${SHA} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Created | ${CREATED} |" >> "$GITHUB_STEP_SUMMARY"

      - name: Build multi-platform and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}
          labels: |
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.authors="Tiago Afonso Marques"
            org.opencontainers.image.url="https://github.com/Tiagura/gotigram"
            org.opencontainers.image.source="https://github.com/Tiagura/gotigram"
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
            org.opencontainers.image.licenses="MIT"
            org.opencontainers.image.title="Gotigram"
            org.opencontainers.image.description="Telegram bot that bridges your Gotify notifications directly to your Telegram DMs"