name: CI Security Scan Secrets

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sec-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Compute checkout depth
        id: depth
        run: |
          echo "depth=$((${{ github.event.pull_request.commits }} + 2))" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: ${{ steps.depth.outputs.depth }}
          persist-credentials: false
          fetch-tags: false

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b   # v3.97.1
        with:
          extra_args: --log-level=2 --results=verified,unknown

      - name: Publish results to summary
        if: always()
        run: |
          set -euo pipefail

          echo "## TruffleHog Secret Scan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ job.status }}" == "success" ]; then
            echo "**Passed** - no secrets detected." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Failed** - potential secrets found. Check the job log for details." >> "$GITHUB_STEP_SUMMARY"
          fi